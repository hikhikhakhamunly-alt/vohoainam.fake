
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ thống tìm rương Xu - VHN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0d0c11;color:white;
 font-family:Arial,sans-serif;padding:18px;
}
.container{max-width:850px;margin:auto}
.panel{
 background:#19171e;border:1px solid #34313d;
 border-radius:22px;padding:22px;margin:20px 0;
 box-shadow:0 0 25px #00d9e522;
}
h1{
 color:#ff9b25;text-align:center;
 text-shadow:0 0 12px #ff7600;
 font-size:25px;
}
h2{text-align:center}
input{
 background:#101015;color:white;border:1px solid #00d8d8;
 border-radius:12px;padding:16px;width:100%;
 font-size:16px;margin:10px 0;
}
button{
 cursor:pointer;border:1px solid #37333e;
 background:#201e26;color:white;
 padding:13px 17px;border-radius:13px;
 font-size:15px;font-weight:bold;
}
button:active{transform:scale(.97)}
.primary{
 background:linear-gradient(100deg,#ff443f,#ff9a00);
 border:0;color:white;
}
.neon{border-color:#00dada;color:#00e5e5}
.blue{border-color:#1684ff;color:#65aaff}
.hidden{display:none!important}
.groups,.tabs{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;margin:20px 0;
}
.tabs{grid-template-columns:repeat(4,1fr)}
.tabs button.active{
 background:linear-gradient(100deg,#ff8b00,#303038);
 border-color:#ff9200;color:white;
}
.card{
 background:#17151c;border:1px solid #35313b;
 border-left:7px solid #12e8e5;
 border-radius:18px;padding:17px;
 margin:15px 0;
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;flex-wrap:wrap;
}
.link{color:#14e5e5;font-size:18px;font-weight:bold}
.meta{font-size:13px;color:#ff9a35;margin-top:9px}
.ratio{color:#ff426b;margin-left:8px}
.timer{
 color:#00e5df;border:2px solid #087b7b;
 border-radius:13px;padding:10px;text-align:center;
 min-width:105px;font-size:22px;font-weight:bold;
}
.expired{color:#ff426b;border-color:#ff426b}
.open{background:linear-gradient(90deg,#ff3263,#ff9b00)}
small{color:#999}
#device{overflow-wrap:anywhere;color:#aaa}
@media(max-width:500px){
 body{padding:8px}
 .panel{padding:13px}
 .tabs{grid-template-columns:repeat(2,1fr)}
 .card{padding:12px}
 h1{font-size:21px}
}
</style>
</head>
<body>
<div class="container">

<!-- TRANG KICH HOAT -->
<section id="activation" class="panel">
<h1>👑 Võ Hoài Nam ✨</h1>
<h2>🔐 KÍCH HOẠT THIẾT BỊ</h2>
<p style="text-align:center;color:#aaa">
Thiết bị của bạn chưa được cấp quyền truy cập.
</p>

<div class="groups">
<button class="blue" onclick="alert('Nhóm Zalo - Demo')">🔵 Nhóm Zalo</button>
<button class="neon" onclick="alert('Nhóm Telegram - Demo')">✈ Nhóm Telegram</button>
</div>

<h3>🔑 Nhập Mã Key Kích Hoạt:</h3>
<input id="key" placeholder="VD: VIP-8A2B-X7K1-9M4P">
<button class="primary" style="width:100%" onclick="activate()">
⚡ KÍCH HOẠT
</button>

<hr style="border-color:#333;margin:25px 0">
<p style="text-align:center;color:#888">MÃ THIẾT BỊ CỦA BẠN</p>
<p id="device">device_demo_2026</p>
<button onclick="copyDevice()">Sao chép ID</button>
</section>

<!-- TRANG CHINH -->
<section id="dashboard" class="hidden">
<div class="panel">
<h1>🟢 Hệ thống tìm rương Xu - VHN</h1>

<div class="card">
<span>🟠 DEMO - 25/11/2026</span>
<span style="color:#ff9a25">⌛ <span id="systemTimer">59:59</span></span>
</div>

<button class="neon" style="width:100%"
onclick="render()">⟳ LÀM MỚI</button>

<div class="groups">
<button class="blue" onclick="alert('Nhóm Zalo - Demo')">🔵 Nhóm Zalo</button>
<button class="neon" onclick="alert('Nhóm Telegram - Demo')">✈ Nhóm Telegram</button>
</div>

<div class="tabs">
<button class="active" onclick="changeTab(0,this)">Rương xu</button>
<button onclick="changeTab(1,this)">Rương treo</button>
<button onclick="changeTab(2,this)">Túi xu</button>
<button onclick="changeTab(3,this)">Kênh Test</button>
</div>
</div>

<div id="items"></div>
<p style="text-align:center;color:#777">
HỆ THỐNG DEMO - DỮ LIỆU MINH HỌA
</p>
</section>
</div>

<script>
let tab=0;
let systemSeconds=3599;

const samples=[
[
["5487381","33/8","4.1",49],
["5487314","100/25","4.0",49],
["5487312","31/5","6.2",61],
["5487309","20/5","4.0",46],
["5487306","35/5","7.0",60]
],
[
["5487386","50/5","10.0",0],
["5487348","21/8","2.6",0],
["5487343","49/15","3.3",0],
["5487340","20/2","10.0",0],
["5487328","50/20","2.5",0]
],
[
["5487390","20/5","4.0",60],
["5487388","35/7","5.0",45],
["5487370","50/10","5.0",30]
],
[
["5487395","100/25","4.0",75],
["5487392","31/5","6.2",60],
["5487389","20/5","4.0",45]
]
];

let data=JSON.parse(JSON.stringify(samples));

function activate(){
 document.getElementById("activation").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 render();
}

function copyDevice(){
 navigator.clipboard.writeText("device_demo_2026");
 alert("Đã sao chép ID demo!");
}

function changeTab(n,btn){
 tab=n;
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function render(){
 const box=document.getElementById("items");
 box.innerHTML="";
 data[tab].forEach((item,i)=>{
 let [id,b,r,t]=item;
 let expired=t<=0;
 let card=document.createElement("div");
 card.className="card";
 card.innerHTML=`
 <div>
  <div style="color:#aaa">15:03:${58-i}</div>
  <div class="link">link${id}</div>
  <div class="meta">
   Box: ${b}<span class="ratio">Ratio: ${r}</span>
  </div>
 </div>
 <div class="timer ${expired?'expired':''}">
  <span class="count">${format(t)}</span>
  <div style="font-size:12px">${expired?'NỔ NGAY':'CÒN LẠI'}</div>
 </div>
 <button class="open" onclick="openDemo('${id}')">Mở Link</button>
 `;
 box.appendChild(card);
 });
}

function format(t){
 return String(Math.floor(t/60)).padStart(2,'0')+":"+
 String(t%60).padStart(2,'0');
}

function openDemo(id){
 alert("Link mẫu: "+id+"\nChưa kết nối link TikTok thật.");
}

setInterval(()=>{
 systemSeconds=Math.max(0,systemSeconds-1);
 document.getElementById("systemTimer").textContent=format(systemSeconds);

 data.forEach(group=>{
 group.forEach(item=>{
 if(item[3]>0)item[3]--;
 });
 });
 if(!document.getElementById("dashboard").classList.contains("hidden")){
 render();
 }
},1000);
</script>
</body>
</html>
